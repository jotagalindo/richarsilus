# Release: al subir una etiqueta vX.Y.Z (igual a "## Version:" del TOC) pasa luacheck y los tests,
# empaqueta el addon y publica una release de GitHub con el zip listo para Interface\AddOns.
# Las etiquetas con guion (v1.1.0-beta1) se publican como prerelease.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the development image
        run: docker build -t richarsilus-dev tools

      - name: luacheck and busted
        run: docker run --rm -v "$PWD:/addon" richarsilus-dev

      - name: Package the addon (the tag must match the TOC version)
        run: docker run --rm -v "$PWD:/addon" richarsilus-dev sh tools/package.sh "$GITHUB_REF_NAME"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="dist/Richarsilus-${version}.zip"
          prerelease_flag=""
          case "$version" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          # shellcheck disable=SC2086 # prerelease_flag is empty or a single flag
          gh release create "$GITHUB_REF_NAME" "$archive" \
            --verify-tag \
            --title "Richarsilus $GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease_flag
